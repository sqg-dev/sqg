packages:
  - sqg
  - website
  - examples/typescript-sqlite
  - examples/typescript-duckdb
  - examples/typescript-sqlite-benchmark
  - sqg-ui
  - sqg-ui/frontend
  - sqg-ui/server
  - sqg-ui/shared

allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true

catalog:
  '@astrojs/check': ^0.9.10
  '@astrojs/node': ^11.1.5
  '@astrojs/starlight': ^0.42.0
  '@astrojs/svelte': ^9.0.1
  '@biomejs/biome': 2.5.12
  '@clack/prompts': ^1.7.0
  '@codemirror/autocomplete': ^6.20.3
  '@codemirror/commands': ^6.11.0
  '@codemirror/lang-sql': ^6.10.0
  '@codemirror/lint': ^6.9.7
  '@codemirror/state': 6.7.1
  '@codemirror/theme-one-dark': ^6.1.3
  '@codemirror/view': ^6.43.11
  '@duckdb/node-api': 1.5.5-r.4
  '@duckdb/node-bindings-linux-x64': 1.5.5-r.4
  '@epic-web/cachified': ^5.6.3
  '@fastify/cors': ^11.3.0
  '@lezer-unofficial/printer': ^1.0.1
  '@lezer/common': ^1.5.2
  '@lezer/generator': ^1.8.0
  '@lezer/lr': ^1.4.10
  '@libsql/client': ^0.18.0
  '@modelcontextprotocol/sdk': ^1.30.0
  '@plausible-analytics/tracker': ^0.4.6
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@tailwindcss/vite': ^4.3.3
  # Pinned to the alpha deliberately: v9 stable replaced row models
