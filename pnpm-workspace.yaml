  '@tanstack/svelte-table': 9.0.0-alpha.10
  '@testcontainers/postgresql': ^12.1.0
  '@trpc/client': ^11.18.0
  '@trpc/server': ^11.18.0
  '@tursodatabase/database': ^0.7.2
  '@types/better-sqlite3': ^9.6.0
  '@types/dockerode': ^4.0.1
  '@types/node': ^26.4.1
  '@types/pg': ^8.23.1
  '@types/update-notifier': ^6.0.8
  '@vitest/ui': ^5.0.0
  '@xyflow/svelte': ^1.6.6
  astro: ^7.3.1
  astro-d2: ^0.13.1
  autoprefixer: ^10.5.5
  better-sqlite3: ^13.0.3
  codemirror: ^6.0.2
  commander: ^15.0.0
  concurrently: ^10.0.5
  consola: ^3.4.2
  dockerode: ^5.0.1
  dotenv: ^17.4.2
  elkjs: ^0.12.0
  es-toolkit: ^1.52.0
  fastify: ^5.12.3
  handlebars: ^4.7.9
  lru-cache: ^11.5.2
  pg: ^8.23.0
  pg-types: ^4.1.0
  picocolors: ^1.1.1
  pino-pretty: ^13.1.3
  playwright: ^1.63.0
  prettier: ^3.9.6
  prettier-plugin-java: ^2.10.3
  shiki: ^4.4.3
  starlight-blog: ^0.29.0
  svelte: ^5.57.0
  tailwindcss: ^4.3.3
  tinybench: ^6.1.6
  tsdown: 0.23.0
  tsx: ^4.23.13
  # TypeScript 7 is the native port: its "." export is only lib/version.cjs, so the
  # legacy compiler API (ts.sys, ts.findConfigFile) and tsserver are gone. Volar-based
  # tooling — @astrojs/language-server, and therefore `astro check` — cannot run on it.
  typescript: ^6.0.3
  update-notifier: ^7.3.1
  vite: ^8.2.2
  vitest: ^5.0.0
  yaml: ^2.9.0
  yocto-spinner: ^1.2.2
  zod: ^4.5.4

injectWorkspacePackages: false

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - cpu-features
  - esbuild
  - protobufjs
  - sharp
  - ssh2

overrides:
  '@codemirror/state': 6.5.2
