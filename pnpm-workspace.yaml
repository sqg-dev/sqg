  # TypeScript 7 is the native port: its "." export is only lib/version.cjs, so the
  # legacy compiler API (ts.sys, ts.findConfigFile) and tsserver are gone. Volar-based
  # tooling — @astrojs/language-server, and therefore `astro check` — cannot run on it.
  typescript: ^6.0.3
  update-notifier: ^7.3.1
  vite: ^7.3.1
  vitest: ^4.1.2
  yaml: ^2.9.0
  yocto-spinner: ^1.1.0
  zod: ^4.3.6

injectWorkspacePackages: false

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - cpu-features
  - esbuild
  - protobufjs
  - sharp
  - ssh2

overrides:
  '@codemirror/state': 6.5.2
